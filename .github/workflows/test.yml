name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: 语法检查
        run: python -m py_compile agent.py bootstrap_memory.py build_docs.py site/build_site.py
      - name: 角色职责库是合法 JSON
        run: python -c "import json; json.load(open('roles/角色职责库.json', encoding='utf-8'))"
      - name: 测试（含停止时子进程清理、凭据扫描）
        run: python -m pytest -q tests
