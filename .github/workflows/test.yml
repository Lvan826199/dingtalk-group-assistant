name: test
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    # 私有仓库不跑（GitHub 私有仓库的 Actions 要计费分钟，macOS 按 10 倍、Windows 按 2 倍算，11-19 一天推了十几次就超了额度；
    # 超额后任务直接报失败）。同样的代码导出到开源仓库后免费在三系统上全跑，以开源仓库的结果为准。手动触发时私有仓库也能跑。
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - name: 语法检查
        run: python -m py_compile agent.py bootstrap_memory.py build_docs.py site/build_site.py
      - name: 角色职责库是合法 JSON
        run: python -c "import json; json.load(open('roles/角色职责库.json', encoding='utf-8'))"
      - name: 测试（含停止时子进程清理、凭据扫描）
        run: python -m pytest -q tests
